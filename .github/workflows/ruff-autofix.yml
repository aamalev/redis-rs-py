name: Ruff Auto-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff auto-fix
        run: |
          # Run fixes on project files. Adjust paths if needed.
          ruff check --fix redis_rs tests || true
          ruff format redis_rs tests || true

      - name: Commit fixed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: apply ruff auto-fixes"

      - name: Create pull request with fixes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply ruff auto-fixes"
          branch: fix/ruff-auto-fixes
          title: "chore: apply ruff auto-fixes"
          body: |
            This PR applies automatic ruff fixes generated by the Ruff linter.
            It was created by CI via an on-demand workflow run. Please review changes and merge if OK.
          labels: automated, ruff
